# DCK Agentic — production deployment (VM: agent.dckautoposting.com).
#
# Topology (see docs/DEPLOYMENT.md):
#   - `canvas`   : all-in-one image (agent-server + automation + frontend),
#                  Canvas served at the ROOT path, ingress on 127.0.0.1:8010.
#   - `postgres` : dedicated Postgres 17 for DCK — holds the automation DB
#                  (dck_agentic) AND one database per webgen app (dck_<app>).
#                  Internal-only (no published port); reached by service name.
#
# Canvas, Postgres, and the Beszel Hub share the named `dck` network. Webgen
# apps join this network as external (`name: dck`) and reach Postgres as
# `postgres:5432`; the Beszel agent uses host networking for host metrics.
#
# All persistent data is bind-mounted under the release directory
# (/opt/dck-agentic on the VM): ./config, ./workspace, ./pgdata,
# ./beszel-data, ./beszel-agent-data.

services:
  canvas:
    # Full image ref. CI publishes `dck-agentic` under the repo owner's GHCR
    # namespace (ghcr.io/<owner>/dck-agentic). Set CANVAS_IMAGE in .env to your
    # owner's path; CANVAS_IMAGE_TAG picks the tag.
    image: ${CANVAS_IMAGE:-ghcr.io/dck-ai/dck-agentic}:${CANVAS_IMAGE_TAG:-latest}
    container_name: dck-agentic-canvas
    restart: unless-stopped
    # Host Docker API access is required for monitoring and Webgen lifecycle
    # operations. The supplemental GID is discovered by dck-deploy.sh. Docker
    # socket access is root-equivalent; do not add privileged mode as well.
    group_add:
      - "${DOCKER_GID:?Run scripts/dck-deploy.sh to configure Docker socket access}"
    ports:
      # Published to host loopback only. Host port 8000 is taken by another
      # service on this VM, so DCK ingress uses 8010. nginx terminates TLS
      # and forwards here; it MUST set X-Forwarded-Proto / X-Forwarded-For.
      - "127.0.0.1:8010:8000"
    volumes:
      - ./config:/home/openhands/.openhands
      - ./workspace:/projects
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AGENT_CANVAS_DISABLE_TELEMETRY=1
      # Canvas at the root path (image is built with VITE_BASE_PATH=/, this
      # keeps the runtime static-server mount consistent with the bundle).
      - AGENT_CANVAS_BASE_PATH=/
      # Username/password login portal (per-user accounts). First launch:
      # open the site and create the admin at /setup. Store + the internal
      # auto-generated session key persist on the ./config volume.
      - AGENT_CANVAS_PORTAL_AUTH=/home/openhands/.openhands/portal-auth.json
      # External base URL used in automation callbacks injected into sandboxes.
      - AUTOMATION_BASE_URL=${AUTOMATION_BASE_URL:-https://agent.dckautoposting.com}
      - AUTOMATION_DB_URL=${AUTOMATION_DB_URL:?Set AUTOMATION_DB_URL, e.g. postgresql+asyncpg://dck:pass@postgres:5432/dck_agentic}
    extra_hosts:
      # Lets webgen apps / the agent reach host services (e.g. the existing
      # redis-shared on 127.0.0.1:6379) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/alive 2>/dev/null | grep -qE '^(200|302)$$' || timeout 5 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - dck

  postgres:
    image: postgres:17-alpine
    container_name: dck-agentic-postgres
    restart: unless-stopped
    # No `ports:` — internal only. Reached as `postgres:5432` on the dck
    # network by both the canvas service and webgen app containers.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Automation database, created on first init. Webgen apps get their own
      # `dck_<app>` databases created by the agent via the admin role.
      - POSTGRES_DB=${POSTGRES_DB:-dck_agentic}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dck

  # Beszel provides host-level metrics and historical charts alongside the
  # DCK Monitoring page, which remains responsible for app/service snapshots.
  beszel:
    image: henrygd/beszel:0.21.0
    container_name: dck-agentic-beszel
    restart: unless-stopped
    environment:
      - APP_URL=${BESZEL_APP_URL:-http://localhost:8090}
      # Beszel creates its first user on a fresh data directory. The production
      # deploy script generates and stores these credentials in the protected
      # .env file before the Hub starts.
      - USER_EMAIL=${BESZEL_ADMIN_EMAIL:-}
      - USER_PASSWORD=${BESZEL_ADMIN_PASSWORD:-}
    ports:
      # Keep the hub private; nginx is the only public ingress.
      - "127.0.0.1:${BESZEL_PORT:-8090}:8090"
    volumes:
      - ./beszel-data:/beszel_data
    networks:
      - dck

  # Creates/reuses the Hub public key and permanent token before the host agent
  # starts, then writes both to persistent agent data.
  beszel-token-init:
    image: node:22-alpine
    container_name: dck-agentic-beszel-token-init
    restart: "no"
    depends_on:
      beszel:
        condition: service_started
    environment:
      - BESZEL_HUB_URL=http://beszel:8090
      - BESZEL_ADMIN_EMAIL=${BESZEL_ADMIN_EMAIL:-}
      - BESZEL_ADMIN_PASSWORD=${BESZEL_ADMIN_PASSWORD:-}
      - BESZEL_AGENT_KEY=${BESZEL_AGENT_KEY:-}
      - BESZEL_AGENT_KEY_FILE=/agent-data/public-key
      - BESZEL_AGENT_TOKEN=${BESZEL_AGENT_TOKEN:-}
      - BESZEL_AGENT_TOKEN_FILE=/agent-data/universal-token
    volumes:
      - ./scripts/dck-beszel-token.mjs:/app/dck-beszel-token.mjs:ro
      - ./beszel-agent-data:/agent-data
    command: ["node", "/app/dck-beszel-token.mjs"]
    networks:
      - dck

  # Host networking is required for accurate host network-interface metrics.
  # No Docker socket is mounted: DCK Monitoring already provides container
  # status/metrics, and this agent only needs host-level telemetry.
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: dck-agentic-beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      beszel-token-init:
        condition: service_completed_successfully
    environment:
      - HUB_URL=http://127.0.0.1:${BESZEL_PORT:-8090}
      - KEY_FILE=/var/lib/beszel-agent/public-key
      - TOKEN_FILE=/var/lib/beszel-agent/universal-token
      - DISABLE_SSH=true
      - SYSTEM_NAME=DCK Agentic host
    volumes:
      - ./beszel-agent-data:/var/lib/beszel-agent

networks:
  # Named (not external) so `docker compose` creates it deterministically as
  # `dck`. Webgen app compose files reference it as external with `name: dck`.
  dck:
    name: dck
