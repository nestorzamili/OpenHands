# DCK Agentic — production deployment (VM: agent.dckautoposting.com).
#
# Topology (see docs/DEPLOYMENT.md):
#   - `canvas`   : all-in-one image (agent-server + automation + frontend),
#                  Canvas served at the ROOT path, ingress on 127.0.0.1:8010.
#   - `postgres` : dedicated Postgres 17 for DCK — holds the automation DB
#                  (dck_agentic) AND one database per webgen app (dck_<app>).
#                  Internal-only (no published port); reached by service name.
#
# Canvas and Postgres share the named `dck` network. Webgen apps join this
# network as external (`name: dck`) and reach Postgres as `postgres:5432`.
#
# All persistent data is bind-mounted under the release directory
# (/opt/dck-agentic on the VM): ./config, ./workspace, and ./pgdata.

services:
  canvas:
    # Full image ref. CI publishes `dck-agentic` under the repo owner's GHCR
    # namespace (ghcr.io/<owner>/dck-agentic). Set CANVAS_IMAGE in .env to your
    # owner's path; CANVAS_IMAGE_TAG picks the tag.
    image: ${CANVAS_IMAGE:-ghcr.io/dck-ai/dck-agentic}:${CANVAS_IMAGE_TAG:-latest}
    container_name: dck-agentic-canvas
    restart: unless-stopped
    # Host Docker API access is required for Webgen lifecycle operations. The
    # supplemental GID is discovered by dck-deploy.sh. Docker socket access is
    # root-equivalent; do not add privileged mode as well.
    group_add:
      - "${DOCKER_GID:?Run scripts/dck-deploy.sh to configure Docker socket access}"
    ports:
      # Published to host loopback only. Host port 8000 is taken by another
      # service on this VM, so DCK ingress uses 8010. nginx terminates TLS
      # and forwards here; it MUST set X-Forwarded-Proto / X-Forwarded-For.
      - "127.0.0.1:8010:8000"
    volumes:
      - ./config:/home/openhands/.openhands
      - ./workspace:/projects
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AGENT_CANVAS_DISABLE_TELEMETRY=1
      # Canvas at the root path (image is built with VITE_BASE_PATH=/, this
      # keeps the runtime static-server mount consistent with the bundle).
      - AGENT_CANVAS_BASE_PATH=/
      # Username/password login portal (per-user accounts). First launch:
      # open the site and create the admin at /setup. Store + the internal
      # auto-generated session key persist on the ./config volume.
      - AGENT_CANVAS_PORTAL_AUTH=/home/openhands/.openhands/portal-auth.json
      # External base URL used in automation callbacks injected into sandboxes.
      - AUTOMATION_BASE_URL=${AUTOMATION_BASE_URL:-https://agent.dckautoposting.com}
      - AUTOMATION_DB_URL=${AUTOMATION_DB_URL:?Set AUTOMATION_DB_URL, e.g. postgresql+asyncpg://dck:pass@postgres:5432/dck_agentic}
    extra_hosts:
      # Lets webgen apps / the agent reach host services (e.g. the existing
      # redis-shared on 127.0.0.1:6379) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/alive 2>/dev/null | grep -qE '^(200|302)$$' || timeout 5 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - dck

  postgres:
    image: postgres:17-alpine
    container_name: dck-agentic-postgres
    restart: unless-stopped
    # No `ports:` — internal only. Reached as `postgres:5432` on the dck
    # network by both the canvas service and webgen app containers.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Automation database, created on first init. Webgen apps get their own
      # `dck_<app>` databases created by the agent via the admin role.
      - POSTGRES_DB=${POSTGRES_DB:-dck_agentic}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dck

networks:
  # Named (not external) so `docker compose` creates it deterministically as
  # `dck`. Webgen app compose files reference it as external with `name: dck`.
  dck:
    name: dck
