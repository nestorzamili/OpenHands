---
name: DCK Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra tag to publish (in addition to sha-<short>)
        type: string
        default: ""
      deploy:
        description: Deploy to the VM over SSH after build (uncheck for build-only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ format('ghcr.io/{0}/dck-agentic', github.repository_owner) }}
  RELEVANT_SHA: ${{ github.sha }}
  RELEVANT_REF: ${{ github.ref }}
  DCK_BASE_PATH: "/"

jobs:
  build-and-push-image:
    name: Build & Push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read defaults from config/defaults.json
        id: config
        run: |
          cfg="${GITHUB_WORKSPACE}/config/defaults.json"
          pkg="${GITHUB_WORKSPACE}/package.json"
          if [ ! -f "$cfg" ] || [ ! -f "$pkg" ]; then
            echo "::error::Missing $cfg or $pkg — checkout did not provide the repo files."
            exit 1
          fi
          AGENT_SERVER_VERSION=$(jq -r '.versions.agentServer' "$cfg")
          AGENT_SERVER_IMAGE_BASE=$(jq -r '.images.agentServer' "$cfg")
          AUTOMATION_VERSION=$(jq -r '.versions.automation' "$cfg")
          AGENT_CANVAS_VERSION=$(jq -r '.version' "$pkg")
          echo "agent_server_version=$AGENT_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "default_agent_server_image=${AGENT_SERVER_IMAGE_BASE}:${AGENT_SERVER_VERSION}-python" >> "$GITHUB_OUTPUT"
          echo "default_automation_version=$AUTOMATION_VERSION" >> "$GITHUB_OUTPUT"
          echo "agent_canvas_version=$AGENT_CANVAS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: prep
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE" =~ ^ghcr\.io/[a-z0-9._-]+(/[a-z0-9._-]+)*$ ]]; then
            echo "::error::IMAGE must be an untagged lowercase GHCR image path (ghcr.io/owner/package)."
            exit 1
          fi

          if [ -n "$EXTRA_TAG" ] && [[ ! "$EXTRA_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::tag must be a valid Docker tag (1-128 safe characters)."
            exit 1
          fi

          SHORT_SHA=$(echo "$RELEVANT_SHA" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          TAGS=""
          add_tag() { TAGS="${TAGS:+${TAGS},}${IMAGE}:${1}-${ARCH}"; }

          add_tag "sha-${SHORT_SHA}"

          if [ -n "$EXTRA_TAG" ]; then
            add_tag "$EXTRA_TAG"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Build & Push (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            AGENT_SERVER_IMAGE=${{ steps.config.outputs.default_agent_server_image }}
            AGENT_SERVER_VERSION=${{ steps.config.outputs.agent_server_version }}
            AUTOMATION_VERSION=${{ steps.config.outputs.default_automation_version }}
            AGENT_CANVAS_VERSION=${{ steps.config.outputs.agent_canvas_version }}
            OPENHANDS_BUILD_GIT_SHA=${{ env.RELEVANT_SHA }}
            OPENHANDS_BUILD_GIT_REF=${{ env.RELEVANT_REF }}
            VITE_BASE_PATH=${{ env.DCK_BASE_PATH }}
            VITE_DEFAULT_BACKEND_NAME=Production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Save build info for consolidation
        env:
          TAGS: ${{ steps.prep.outputs.tags }}
        run: |
          mkdir -p build-info
          jq -n \
            --arg arch "${{ matrix.arch }}" \
            --arg image "$IMAGE" \
            --arg short_sha "${{ steps.prep.outputs.short_sha }}" \
            --arg tags "$TAGS" \
            '{arch: $arch, image: $image, short_sha: $short_sha, tags: $tags}' \
            > "build-info/${{ matrix.arch }}.json"
          cat "build-info/${{ matrix.arch }}.json"

      - name: Upload build info artifact
        uses: actions/upload-artifact@v7
        with:
          name: dck-build-info-${{ matrix.arch }}
          path: build-info/${{ matrix.arch }}.json
          retention-days: 1

  merge-manifests:
    name: Merge Multi-Arch Manifests
    needs: build-and-push-image
    runs-on: ubuntu-24.04
    steps:
      - name: Download build info artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dck-build-info-*
          merge-multiple: true
          path: build-info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          if [[ ! -f build-info/amd64.json ]] || [[ ! -f build-info/arm64.json ]]; then
            echo "::error::Missing architecture builds (need both amd64.json and arm64.json)"
            exit 1
          fi

          AMD64_TAGS_CSV=$(jq -r '.tags' build-info/amd64.json)
          declare -A SEEN=()

          IFS=',' read -ra AMD64_TAGS <<< "$AMD64_TAGS_CSV"
          for AMD64_IMAGE_TAG in "${AMD64_TAGS[@]}"; do
            [ -z "$AMD64_IMAGE_TAG" ] && continue
            TAG_NAME=${AMD64_IMAGE_TAG#${IMAGE}:}
            [[ "$TAG_NAME" == *-amd64 ]] || continue
            MANIFEST_TAG=${TAG_NAME%-amd64}
            [ -n "${SEEN[$MANIFEST_TAG]+x}" ] && continue
            SEEN[$MANIFEST_TAG]=1

            docker buildx imagetools create -t "${IMAGE}:${MANIFEST_TAG}" \
              "${IMAGE}:${MANIFEST_TAG}-amd64" \
              "${IMAGE}:${MANIFEST_TAG}-arm64"
            docker buildx imagetools inspect "${IMAGE}:${MANIFEST_TAG}"
          done

  deploy:
    name: Deploy to VM over SSH
    needs: merge-manifests
    if: inputs.deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: echo "sha=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Stage deploy files
        run: |
          STAGE=stage
          mkdir -p "$STAGE/workspace" "$STAGE/scripts"
          cp docker-compose.yml "$STAGE/"
          cp .env.production.sample "$STAGE/"
          cp -r workspace/.agents "$STAGE/workspace/"
          cp workspace/AGENTS.md "$STAGE/workspace/"
          cp scripts/migrate-automation-db.sh "$STAGE/scripts/"
          cp scripts/dck-deploy.sh "$STAGE/scripts/"
          cp scripts/dck-deploy-remote.sh "$STAGE/scripts/"
          tar -czf deploy.tar.gz -C "$STAGE" .

      - name: Parse SSH target
        id: ssh
        env:
          TARGET: ${{ secrets.VM_SSH_TARGET }}
        run: |
          uh="${TARGET%:*}"
          p="${TARGET##*:}"
          [ "$p" = "$TARGET" ] && p=22
          echo "user_host=$uh" >> "$GITHUB_OUTPUT"
          echo "port=$p" >> "$GITHUB_OUTPUT"
          echo "host=${uh##*@}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ steps.ssh.outputs.port }}" "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy files to VM
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ steps.ssh.outputs.port }}" \
            deploy.tar.gz "${{ steps.ssh.outputs.user_host }}:/tmp/dck-deploy.tar.gz"

      - name: Deploy over SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="set -e
          trap 'rm -rf /tmp/dck-staging /tmp/dck-deploy.tar.gz' EXIT
          rm -rf /tmp/dck-staging
          mkdir -p /tmp/dck-staging
          tar -xzf /tmp/dck-deploy.tar.gz -C /tmp/dck-staging
          rm -f /tmp/dck-deploy.tar.gz
          bash /tmp/dck-staging/scripts/dck-deploy-remote.sh '${{ steps.tag.outputs.sha }}' '$IMAGE' '$GHCR_USERNAME' /tmp/dck-staging"
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${{ steps.ssh.outputs.port }}" \
            "${{ steps.ssh.outputs.user_host }}" "$REMOTE_COMMAND"
